<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Warehouse Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  <style>
    body { background: #0A1628; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-bg {
      position: fixed; inset: 0; background-size: cover; background-position: center;
      {% if bg.login_background_url %}
        background-image: url('{{ bg.login_background_url }}');
      {% endif %}
    }
    .login-bg::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(10,22,40,0.62);
    }
    .login-card {
      position: relative; z-index: 10;
      background: rgba(21,34,56,0.93);
      border: 1px solid rgba(59,130,246,0.18);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%; max-width: 440px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="mb-3">
        <span style="background:linear-gradient(135deg,#2563EB,#7C3AED);border-radius:14px;padding:14px 18px;display:inline-block;">
          <i class="bi bi-boxes text-white fs-3"></i>
        </span>
      </div>
      <h4 class="fw-bold text-white mb-1">Warehouse Dashboard</h4>
      <p class="text-white-50 small">Sign in to continue</p>
    </div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" style="background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);">
      <i class="bi bi-exclamation-circle text-danger"></i>
      <span class="text-danger small">{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label text-white-50 small">Login</label>
        <div class="input-group">
          <span class="input-group-text wh-input-addon"><i class="bi bi-person"></i></span>
          <input type="text" name="login" class="form-control wh-input" placeholder="Your username" required autofocus autocomplete="username" />
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label text-white-50 small">Password</label>
        <div class="input-group">
          <span class="input-group-text wh-input-addon"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="passwordInput" class="form-control wh-input" placeholder="••••••••" required minlength="6" />
          <button type="button" class="input-group-text wh-input-addon" onclick="togglePwd()" title="Show/hide password">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold py-2" style="background:linear-gradient(135deg,#2563EB,#7C3AED);border:none;border-radius:10px;">
        <i class="bi bi-box-arrow-in-right me-2"></i>Log in
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePwd() {
      const inp = document.getElementById('passwordInput');
      const ico = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; ico.className = 'bi bi-eye-slash'; }
      else { inp.type = 'password'; ico.className = 'bi bi-eye'; }
    }
  </script>
</body>
</html>
