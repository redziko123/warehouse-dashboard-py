<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Setup — Warehouse Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  <style>body{background:#0A1628;min-height:100vh;display:flex;align-items:center;justify-content:center;}</style>
</head>
<body>
  <div style="background:rgba(21,34,56,0.93);border:1px solid rgba(59,130,246,.18);border-radius:20px;padding:2.5rem;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.5);">
    <div class="text-center mb-4">
      <div class="mb-3">
        <span style="background:linear-gradient(135deg,#2563EB,#7C3AED);border-radius:14px;padding:14px 18px;display:inline-block;">
          <i class="bi bi-boxes text-white fs-3"></i>
        </span>
      </div>
      <h4 class="fw-bold text-white mb-1">System Setup</h4>
      <p class="text-white-50 small">Create the first administrator account</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 mb-3 small">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label text-white-50 small">Login</label>
        <input type="text" name="username" class="form-control wh-input" required autofocus autocomplete="username" placeholder="Choose username" />
      </div>
      <div class="mb-3">
        <label class="form-label text-white-50 small">Password (min. 6 characters)</label>
        <input type="password" name="password" class="form-control wh-input" required minlength="6" />
      </div>
      <div class="mb-4">
        <label class="form-label text-white-50 small">Repeat password</label>
        <input type="password" name="confirm_password" class="form-control wh-input" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold py-2" style="background:linear-gradient(135deg,#2563EB,#7C3AED);border:none;border-radius:10px;">
        <i class="bi bi-person-check me-2"></i>Create admin account
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
